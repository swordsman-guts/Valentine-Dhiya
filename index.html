<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dhiya 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffd6e8, #ffffff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  text-align: center;
  width: 320px;
  z-index: 5;
}

h1 {
  font-size: 22px;
}

.buttons {
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

button {
  border: none;
  padding: 12px 22px;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yesBtn {
  background: #2ecc71;
  color: white;
}

#noBtn {
  background: #e74c3c;
  color: white;
}

.shake {
  animation: shake 0.4s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

/* 🌷 Petals */
.petal {
  position: fixed;
  top: -20px;
  font-size: 20px;
  animation: fall linear infinite;
  opacity: 0.85;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

#final {
  display: none;
  text-align: center;
}

#final h2 {
  color: #e84393;
  font-size: 26px;
}

.hidden {
  display: none;
  margin-top: 15px;
  color: #555;
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <h1 id="question">Dhiya… will you be my Valentine? 💗</h1>
  <div class="buttons">
    <button id="yesBtn" onclick="yesClick()">Yes 💚</button>
    <button id="noBtn" onclick="noClick()">No ❤️</button>
  </div>
</div>

<div class="card" id="final">
  <h2>HOORAY 💐💗</h2>
  <p>Thanks for being my Valentine.</p>
  <p>🌷 Remember this moment.</p>
  <button onclick="unlock()">💌 Open message</button>
  <div class="hidden" id="secret">
    This wasn’t just a click.<br>
    It’s a memory I’ll always keep 💗
  </div>
</div>

<script>
let step = 0;
let musicPlayed = false;

const questions = [
  "Are you sure? 💭",
  "Really sure? 🥺",
  "Last chance 😳",
  "Okay… final question 💗"
];

function playMusic() {
  if (!musicPlayed) {
    const m = document.getElementById("bgm");
    m.volume = 0.7;
    m.play();
    musicPlayed = true;
  }
}

function noClick() {
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  noBtn.classList.add("shake");
  setTimeout(() => noBtn.classList.remove("shake"), 400);

  document.getElementById("question").innerText =
    step < questions.length ? questions[step] : "You know the answer 😉";

  yesBtn.style.transform = `scale(${1 + step * 0.35})`;
  step++;
}

function yesClick() {
  playMusic(); // 🎵 starts here

  if (step >= questions.length) {
    document.getElementById("card").style.display = "none";
    document.getElementById("final").style.display = "block";
    startPetals();
  } else {
    noClick();
  }
}

function unlock() {
  document.getElementById("secret").style.display = "block";
}

function startPetals() {
  setInterval(() => {
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.innerText = "🌷";
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.body.appendChild(petal);
    setTimeout(() => petal.remove(), 6000);
  }, 300);
}
</script>

</body>
  </html>
