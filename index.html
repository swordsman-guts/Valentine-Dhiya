<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(180deg, #ffe6ef, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.container {
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 2.2em;
  margin-bottom: 20px;
}

button {
  padding: 12px 28px;
  font-size: 1.1em;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s ease;
}

#yes {
  background: #3cb371;
  color: white;
}

#no {
  background: #ff4d4d;
  color: white;
}

.shake {
  animation: shake 0.4s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

.fadeText {
  opacity: 0;
  font-size: 1.8em;
  animation: fade 4s forwards;
}

@keyframes fade {
  0% { opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.glow {
  text-shadow: 0 0 15px pink;
}

.bg-name {
  position: absolute;
  font-size: 5em;
  opacity: 0.08;
  font-weight: bold;
}

#kanroji {
  top: 20%;
  left: 10%;
}

#obanai {
  bottom: 20%;
  right: 10%;
}

.petal {
  position: absolute;
  width: 12px;
  height: 12px;
  background: pink;
  border-radius: 50%;
  animation: fall linear infinite;
  opacity: 0.8;
}

@keyframes fall {
  from { transform: translateY(-10vh); }
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<audio id="bgm" src="music.mp3"></audio>

<div class="container" id="box">
  <h1 id="question">Will you be my Valentine?</h1>
  <button id="yes" onclick="yesClick()">Yes</button>
  <button id="no" onclick="noClick()">No</button>
</div>

<div id="kanroji" class="bg-name" style="display:none;">KANROJI</div>
<div id="obanai" class="bg-name" style="display:none;">OBANAI</div>

<script>
let step = 0;
let yesScale = 1;
let musicPlayed = false;

const questions = [
  "Are you really sure?",
  "Like… really really sure?",
  "No turning back now",
  "Final answer?"
];

function noClick() {
  const noBtn = document.getElementById("no");
  noBtn.classList.add("shake");
  setTimeout(() => noBtn.classList.remove("shake"), 400);
}

function yesClick() {
  const yesBtn = document.getElementById("yes");
  const q = document.getElementById("question");

  if (step < questions.length) {
    q.innerText = questions[step];
    yesScale += 0.25;
    yesBtn.style.transform = `scale(${yesScale})`;
    step++;
  } else {
    finalYes();
  }
}

function finalYes() {
  document.getElementById("box").innerHTML =
    "<h1>Thanks for being my Valentine</h1>";

  startMusic();
  petals();
  timedTexts();
}

function startMusic() {
  if (!musicPlayed) {
    document.getElementById("bgm").play();
    musicPlayed = true;
  }
}

function showText(text, glow=false) {
  const div = document.createElement("div");
  div.className = "fadeText";
  if (glow) div.classList.add("glow");
  div.innerText = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

function timedTexts() {
  setTimeout(() => showText("I think they call this love"), 1000);

  setTimeout(() => {
    document.getElementById("kanroji").style.display = "block";
    document.getElementById("obanai").style.display = "block";
    slowPetals = true;
    showText("I’ll call you Kanroji if I’m your Obanai 💗", true);
  }, 7000);

  setTimeout(() => showText("This song is for you 💗"), 13000);
  setTimeout(() => showText("Guess I fell harder than I planned 💗💗"), 18000);
}

let slowPetals = false;

function petals() {
  setInterval(() => {
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = slowPetals ? "10s" : "6s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 10000);
  }, 300);
}
</script>

</body>
  </html>
